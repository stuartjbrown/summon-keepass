name: Create Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'What type of release to create'
        required: true
        type: choice
        options:
          - release (finalize pre-release or patch bump)
          - minor (new features)
          - major (breaking changes)
          - alpha (pre-release)
          - beta (pre-release)
          - rc (pre-release)
          - custom (specify exact version)
      custom_version:
        description: 'Custom version (only if "custom" is selected above)'
        required: false
        type: string

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-tag.outputs.tag }}
      is_prerelease: ${{ steps.release-type.outputs.is_prerelease }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Install cargo-release
      run: cargo install cargo-release

    - name: Determine release command
      id: release-cmd
      run: |
        RELEASE_TYPE="${{ github.event.inputs.release_type }}"
        CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"

        # Extract the first word from the selection (e.g., "release (finalize...)" -> "release")
        RELEASE_CMD=$(echo "$RELEASE_TYPE" | awk '{print $1}')

        # Handle custom version
        if [ "$RELEASE_CMD" = "custom" ]; then
          if [ -z "$CUSTOM_VERSION" ]; then
            echo "Error: Custom version is required when 'custom' is selected"
            exit 1
          fi
          RELEASE_CMD="$CUSTOM_VERSION"
          echo "📦 Creating custom version: $CUSTOM_VERSION"
        # Handle pre-release levels (alpha, beta, rc)
        elif [[ "$RELEASE_CMD" =~ ^(alpha|beta|rc)$ ]]; then
          echo "📦 Creating pre-release: $RELEASE_CMD of current version"
        # Handle regular version bumps (release, minor, major)
        else
          # Map "release" to "patch" for cargo-release
          if [ "$RELEASE_CMD" = "release" ]; then
            RELEASE_CMD="patch"
          fi
          echo "📦 Creating release: $RELEASE_CMD bump"
        fi

        echo "command=$RELEASE_CMD" >> $GITHUB_OUTPUT
        echo "📦 Will execute: cargo release $RELEASE_CMD"

    - name: Dry-run release
      run: |
        echo "🔍 Running dry-run first..."
        cargo release ${{ steps.release-cmd.outputs.command }} --no-confirm

    - name: Execute release
      run: |
        echo "🚀 Executing release..."
        cargo release ${{ steps.release-cmd.outputs.command }} --execute --no-confirm

    - name: Get version info
      id: get-version
      run: |
        VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📌 Version: $VERSION"

    - name: Get tag name
      id: get-tag
      run: |
        TAG=$(git describe --tags --exact-match HEAD)
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "🏷️ Tag: $TAG"

    - name: Determine release type
      id: release-type
      run: |
        VERSION="${{ steps.get-version.outputs.version }}"
        # Check if version contains pre-release identifier (-, alpha, beta, rc)
        if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
          echo "📦 Creating stable release: v$VERSION"
        else
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
          echo "📦 Creating pre-release: v$VERSION"
        fi

    - name: Extract changelog
      id: changelog
      uses: ./.github/actions/extract-changelog
      with:
        version: ${{ steps.get-version.outputs.version }}

    - name: Push changes
      run: |
        echo "⬆️ Pushing commit and tags..."
        git push --follow-tags

  build:
    needs: version-bump
    uses: ./.github/workflows/build-release-binaries.yml
    with:
      ref: ${{ needs.version-bump.outputs.tag }}

  publish:
    needs: [version-bump, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: release-binaries-*
        path: dist
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version-bump.outputs.tag }}
        prerelease: ${{ needs.version-bump.outputs.is_prerelease }}
        files: dist/*.tar.gz
        body: ${{ needs.version-bump.outputs.changelog }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
