name: Rust CI
# This workflow provides:
# 1. Continuous Integration - runs tests on every push/PR
# 2. Fallback builds - creates releases for manually pushed tags
#
# For automated releases, use the "Create Release" workflow instead (.github/workflows/release.yml)

on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build test Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.test
        tags: summon-keepass:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true

    - name: Run integration tests
      run: docker run --rm summon-keepass:test

  build:
    needs: test
    # Only run build steps when there's a tag
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-release-binaries.yml

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Validate version consistency
      id: version
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
        echo "Tag version: $TAG_VERSION"
        echo "Cargo.toml version: $CARGO_VERSION"
        if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
          echo "❌ Error: Tag version ($TAG_VERSION) doesn't match Cargo.toml version ($CARGO_VERSION)"
          echo "Please use 'cargo release' to create releases, or manually update Cargo.toml to match the tag."
          exit 1
        fi
        echo "✅ Version consistency check passed"
        echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT

    - name: Check Tag
      id: check-tag
      run: |
        if [[ ! -z "${{ github.ref }}" ]] && [[ ${{ github.ref }} =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo ::set-output name=release::true
        fi
        if [[ ! -z "${{ github.ref }}" ]] && [[ ${{ github.ref }} =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-[^[:space:]]+$ ]]; then
            echo ::set-output name=prerelease::true
        fi

    - name: Extract Changelog
      id: changelog
      uses: ./.github/actions/extract-changelog
      with:
        version: ${{ steps.version.outputs.version }}

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: release-binaries-*
        path: dist
        merge-multiple: true

    - name: Prerelease
      uses: softprops/action-gh-release@v1
      if: steps.check-tag.outputs.prerelease == 'true'
      with:
        prerelease: true
        files: dist/*.tar.gz
        body: ${{ steps.changelog.outputs.changelog }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release
      uses: softprops/action-gh-release@v1
      if: steps.check-tag.outputs.release == 'true'
      with:
        files: dist/*.tar.gz
        body: ${{ steps.changelog.outputs.changelog }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
